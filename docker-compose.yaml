name: kaleidogram

services:
    db:
        image: postgres:18-alpine
        container_name: kaleidogram-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            -   "5432:5432"
        volumes:
            -   "kaleidogram_db:/var/lib/postgresql/18/docker"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 40s

    backend:
        image: kaleidogram-backend
        build:
            context: backend
            dockerfile: Dockerfile
        environment:
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_ALGORITHM: ${JWT_ALGORITHM}
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            CORS_ORIGINS: ${CORS_ORIGINS}
        ports:
            -   "8000:8000"
        volumes:
            -   ./backend:/app
            -   /app/.venv
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "poetry run alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    frontend:
        image: kaleidogram-frontend
        build:
            context: frontend
            dockerfile: Dockerfile
        ports:
            -   "5173:5173"
        volumes:
            -   ./frontend:/app
            -   /app/node_modules

volumes:
    kaleidogram_db: